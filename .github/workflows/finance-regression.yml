name: Dueto - regressões financeiras
on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
    branches: [main]
jobs:
  financeiro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe
        run: |
          node --check app.js
          node --check finance-core.mjs
          node --check tests/views-smoke.test.mjs
      - name: Testes financeiros e renderização de 19 telas
        run: node --test tests/finance-core.test.mjs tests/views-smoke.test.mjs
